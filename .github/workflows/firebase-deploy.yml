name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: applyforge-ai
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyC-qnB_qCiIu7_kMVXKnEqx06xI-B6dk0k' }}
      VITE_FIREBASE_AUTH_DOMAIN: applyforge-ai.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: applyforge-ai
      VITE_FIREBASE_STORAGE_BUCKET: applyforge-ai.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '75705445753'
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:75705445753:web:e93c115944ba16c13bd3a8' }}
      VITE_FIREBASE_MEASUREMENT_ID: G-1Z7KP10G1H
      VITE_FIREBASE_FUNCTIONS_REGION: us-central1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Write web environment
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID
          VITE_FIREBASE_FUNCTIONS_REGION=us-central1
          EOF

      - name: Build app
        run: npm run build

      - name: Build functions
        run: npm run functions:build

      - name: Check Firebase deploy credentials
        id: firebase_credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Firebase deploy skipped: FIREBASE_SERVICE_ACCOUNT secret is not configured."
          fi

      - name: Write Firebase service account
        if: steps.firebase_credentials.outputs.deploy_enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy
        if: steps.firebase_credentials.outputs.deploy_enabled == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes
